name: Rust Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust-check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check
